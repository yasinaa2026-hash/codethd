<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>أصدقاء Codethd</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#121212;--panel:#1e1e1e;--header:#181818;--text:#e0e0e0;--muted:#9ca3af;--border:#2a2a2a;--accent:#20c997;--hover:#12b886}
body.light{--bg:#f8f9fa;--panel:#fff;--header:#e9ecef;--text:#212529;--muted:#6c757d;--border:#dee2e6;--accent:#0ca678;--hover:#099268}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{min-height:100vh;background:var(--bg);color:var(--text)}
header{height:64px;background:var(--header);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:1.2rem;font-weight:800}.actions{display:flex;gap:8px;align-items:center}.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:var(--panel);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.following{color:var(--accent);border-color:var(--accent);background:rgba(32,201,151,.1)}
main{max-width:1120px;margin:0 auto;padding:32px 20px 60px}.hero{text-align:center;margin-bottom:24px}.hero-icon{width:72px;height:72px;border-radius:19px;background:rgba(32,201,151,.1);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px;font-size:29px}h1{font-size:1.9rem;margin-bottom:7px}.hero p{color:var(--muted)}
.search{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:15px;display:flex;gap:9px;margin-bottom:17px}.search input{flex:1;height:46px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:0 13px;outline:0;font-size:.96rem}.search input:focus{border-color:var(--accent)}.search button{min-width:110px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}.user{display:flex;gap:12px}.avatar{width:58px;height:58px;border-radius:50%;border:1px solid var(--border);object-fit:cover;background:var(--bg)}.user-info{min-width:0;flex:1}.name{display:flex;gap:7px;align-items:center}.name strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.username{color:var(--muted);font-size:.78rem}.bio{color:var(--muted);font-size:.82rem;line-height:1.55;margin:7px 0}.meta{color:var(--muted);font-size:.76rem;display:flex;gap:10px;flex-wrap:wrap}.actions2{display:flex;gap:7px;margin-top:11px}.actions2 .btn{flex:1;justify-content:center;font-size:.81rem;padding:7px}
.profile{display:none;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:19px;margin-bottom:18px}.profile.show{display:block}.profile-head{display:flex;gap:15px;align-items:flex-start}.profile-avatar{width:82px;height:82px;border-radius:17px;border:1px solid var(--border);object-fit:cover}.profile-body{flex:1;min-width:0}.profile-top{display:flex;justify-content:space-between;gap:12px}.profile-top h2{font-size:1.35rem}.profile-body p{color:var(--muted);line-height:1.6;margin:7px 0 10px}.pmeta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.78rem}.section{margin-top:17px}.section h3{font-size:1.05rem;margin-bottom:11px}.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:12px}.project{border:1px solid var(--border);border-radius:11px;padding:14px;background:var(--bg)}.project h4{margin-bottom:6px;word-break:break-word}.project p{color:var(--muted);font-size:.79rem;line-height:1.55;min-height:36px}.open{margin-top:10px}.empty{padding:45px 18px;text-align:center;border:1px dashed var(--border);border-radius:13px;background:var(--panel)}.empty i{font-size:34px;color:var(--accent);margin-bottom:11px}.empty p{color:var(--muted);margin-top:5px;line-height:1.6}.status{min-height:23px;color:var(--muted);font-size:.84rem;margin-bottom:10px}.loading{text-align:center;color:var(--muted);padding:26px}
@media(max-width:650px){header{padding:0 10px}.hide-mobile{display:none}main{padding:25px 12px 45px}.search{flex-direction:column}.search button{width:100%}.profile-head{flex-direction:column}.profile-top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="logo"><i class="fa-solid fa-code"></i><span>Codethd</span></div><div class="actions"><a class="btn" href="index.html"><i class="fa-solid fa-arrow-right"></i><span class="hide-mobile">المحرر</span></a><a class="btn" href="projects.html"><i class="fa-solid fa-folder-open"></i><span class="hide-mobile">مشاريعي</span></a><button class="btn" id="theme">🌙</button></div></header>
<main>
<section class="hero"><div class="hero-icon"><i class="fa-solid fa-user-group"></i></div><h1>أصدقاء Codethd</h1><p>ابحث عن أعضاء Codethd بالاسم، افتح ملفهم، وشاهد مشاريعهم وتابعهم.</p></section>
<div class="search"><input id="q" placeholder="ابحث باسم المستخدم أو الاسم الظاهر..." autocomplete="off"><button id="searchBtn" class="btn primary"><i class="fa-solid fa-search"></i> بحث</button></div>
<div id="status" class="status"></div><section id="profile" class="profile"></section><section id="results" class="results"></section>
</main>
<script src="supabase-config.js"></script>
<script>
(async function(){
const U=window.CODETHD_SUPABASE_URL,K=window.CODETHD_SUPABASE_KEY;
if(!U||!K){document.getElementById('status').textContent='اربط Supabase أولًا من supabase-config.js';return}
const supabase=window.supabase.createClient(U,K),$=id=>document.getElementById(id);
const {data:{session}}=await supabase.auth.getSession();if(!session){location.href='auth.html';return}
const me=session.user.id;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function followState(){return supabase.from('follows').select('following_id').eq('follower_id',me)}
async function renderUsers(rows){
  const {data:following=[]}=await followState();
  const ids=new Set(following.map(x=>x.following_id));
  $('results').innerHTML=rows.length?rows.map(u=>'<article class="card"><div class="user"><img class="avatar" src="'+esc(u.avatar_url||'')+'" alt=""><div class="user-info"><div class="name"><strong>'+esc(u.display_name||u.username)+'</strong><span class="username">@'+esc(u.username)+'</span></div><div class="bio">'+esc(u.bio||'عضو في Codethd')+'</div><div class="meta"><span><i class="fa-solid fa-user"></i> عضو</span><span><i class="fa-solid fa-code"></i> Codethd</span></div><div class="actions2"><button class="btn primary profileBtn" data-id="'+u.id+'"><i class="fa-solid fa-user"></i> الملف</button><button class="btn '+(ids.has(u.id)?'following':'')+' followBtn" data-id="'+u.id+'"><i class="fa-solid fa-'+(ids.has(u.id)?'check':'plus')+'"></i> '+(ids.has(u.id)?'متابَع':'متابعة')+'</button></div></div></div></article>').join(''):'<div class="empty"><i class="fa-regular fa-user"></i><h2>لا توجد نتائج</h2><p>جرّب اسم مستخدم آخر.</p></div>';
  bind();
}
function bind(){
  document.querySelectorAll('.profileBtn').forEach(b=>b.onclick=()=>openProfile(b.dataset.id));
  document.querySelectorAll('.followBtn').forEach(b=>b.onclick=async()=>{await toggleFollow(b.dataset.id);search()});
}
async function toggleFollow(id){
  if(id===me)return;
  const {data}=await supabase.from('follows').select('following_id').eq('follower_id',me).eq('following_id',id).maybeSingle();
  if(data) await supabase.from('follows').delete().eq('follower_id',me).eq('following_id',id);
  else await supabase.from('follows').insert({follower_id:me,following_id:id});
}
async function search(){
  const q=$('q').value.trim().toLowerCase();$('profile').classList.remove('show');
  if(!q){$('results').innerHTML='';$('status').textContent='اكتب اسم المستخدم للبحث.';return}
  $('status').textContent='جارٍ البحث...';$('results').innerHTML='';
  const {data,error}=await supabase.from('profiles').select('id,username,display_name,bio,avatar_url').or('username_norm.ilike.%'+q+'%,display_name.ilike.%'+q+'%').neq('id',me).order('username_norm').limit(20);
  if(error){$('status').textContent='تعذر تنفيذ البحث: '+error.message;return}
  $('status').textContent=(data?.length||0)+' نتيجة';renderUsers(data||[]);
}
async function openProfile(id){
  $('results').innerHTML='';$('status').textContent='جارٍ تحميل الملف...';$('profile').classList.add('show');$('profile').innerHTML='<div class="loading">جاري التحميل...</div>';
  const [pr,proj,followers,following]=await Promise.all([
    supabase.from('profiles').select('*').eq('id',id).single(),
    supabase.from('projects').select('id,name,html,css,js,updated_at').eq('user_id',id).order('updated_at',{ascending:false}),
    supabase.from('follows').select('follower_id',{count:'exact',head:true}).eq('following_id',id),
    supabase.from('follows').select('following_id',{count:'exact',head:true}).eq('follower_id',id)
  ]);
  if(pr.error){$('profile').innerHTML='<div class="empty"><i class="fa-solid fa-circle-exclamation"></i><h2>تعذر فتح الملف</h2><p>'+esc(pr.error.message)+'</p></div>';return}
  const u=pr.data, followed=(await supabase.from('follows').select('following_id').eq('follower_id',me).eq('following_id',id).maybeSingle()).data;
  $('profile').innerHTML='<div class="profile-head"><img class="profile-avatar" src="'+esc(u.avatar_url||'')+'" alt=""><div class="profile-body"><div class="profile-top"><div><h2>'+esc(u.display_name||u.username)+'</h2><span class="username">@'+esc(u.username)+'</span></div><button id="profileFollow" class="btn '+(followed?'following':'primary')+'"><i class="fa-solid fa-'+(followed?'check':'plus')+'"></i> '+(followed?'متابَع':'متابعة')+'</button></div><p>'+esc(u.bio||'عضو في مجتمع Codethd.')+'</p><div class="pmeta"><span><i class="fa-solid fa-users"></i> '+(followers.count||0)+' متابع</span><span><i class="fa-solid fa-user-plus"></i> '+(following.count||0)+' يتابع</span><span><i class="fa-solid fa-folder-open"></i> '+(proj.data?.length||0)+' مشروع</span></div></div></div><div class="section"><h3>مشاريع '+esc(u.display_name||u.username)+'</h3>'+((proj.data&&proj.data.length)?'<div class="projects">'+proj.data.map(p=>'<article class="project"><h4>'+esc(p.name)+'</h4><p>مشروع منشور داخل Codethd</p><div class="meta"><span><i class="fa-solid fa-clock"></i> '+new Date(p.updated_at).toLocaleDateString('ar-SA')+'</span></div><button class="btn primary open openProject" data-id="'+p.id+'"><i class="fa-solid fa-eye"></i> مشاهدة</button></article>').join('')+'</div>':'<div class="empty"><i class="fa-regular fa-folder-open"></i><h2>لا توجد مشاريع منشورة</h2></div>')+'</div>';
  $('profileFollow').onclick=async()=>{await toggleFollow(id);openProfile(id)}
  document.querySelectorAll('.openProject').forEach(b=>b.onclick=()=>openProject(b.dataset.id));
  window.scrollTo({top:$('profile').offsetTop-75,behavior:'smooth'});
  $('status').textContent='';
}
async function openProject(id){
 const {data,error}=await supabase.from('projects').select('name,html,css,js').eq('id',id).single();
 if(error){alert('تعذر فتح المشروع');return}
 const srcdoc='<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;font-family:Arial,sans-serif}'+(data.css||'')+'</style></head><body>'+(data.html||'')+'<script>'+String(data.js||'').replace(/<\\/script>/gi,'')+'<\\/script></body></html>';
 const w=window.open('about:blank','_blank');if(w){w.document.write(srcdoc);w.document.close()}
}
$('searchBtn').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};
$('theme').onclick=()=>{const light=document.body.classList.toggle('light');localStorage.setItem('codethd-theme',light?'light-mode':'dark-mode');$('theme').textContent=light?'☀️':'🌙'};
const t=localStorage.getItem('codethd-theme')||'dark-mode';document.body.classList.toggle('light',t==='light-mode');$('theme').textContent=t==='light-mode'?'☀️':'🌙';
})();
</script>
</body>
</html>
