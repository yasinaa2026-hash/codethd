<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>أصدقاء Codethd</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#121212;--panel:#1e1e1e;--header:#181818;--text:#e0e0e0;--muted:#9ca3af;--border:#2a2a2a;--accent:#20c997;--hover:#12b886}
body.light{--bg:#f8f9fa;--panel:#fff;--header:#e9ecef;--text:#212529;--muted:#6c757d;--border:#dee2e6;--accent:#0ca678;--hover:#099268}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{min-height:100vh;background:var(--bg);color:var(--text)}
header{height:64px;background:var(--header);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:1.2rem;font-weight:800}.actions{display:flex;gap:8px;align-items:center}.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:var(--panel);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.following{color:var(--accent);border-color:var(--accent);background:rgba(32,201,151,.1)}
main{max-width:1120px;margin:0 auto;padding:32px 20px 60px}.hero{text-align:center;margin-bottom:24px}.hero-icon{width:72px;height:72px;border-radius:19px;background:rgba(32,201,151,.1);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px;font-size:29px}h1{font-size:1.9rem;margin-bottom:7px}.hero p{color:var(--muted)}
.search{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:15px;display:flex;gap:9px;margin-bottom:17px}.search input{flex:1;height:46px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:0 13px;outline:0;font-size:.96rem}.search input:focus{border-color:var(--accent)}.search button{min-width:110px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}.section-label{grid-column:1/-1;font-size:1.05rem;font-weight:800;margin:9px 2px 0}.friend-count{color:var(--muted);font-size:.8rem;font-weight:600;margin-right:6px}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;transition:.2s;overflow:hidden}.card:hover{transform:translateY(-2px);border-color:var(--accent)}.user{display:flex;gap:12px}.avatar{width:58px;height:58px;border-radius:50%;border:1px solid var(--border);object-fit:cover;background:var(--bg)}.user-info{min-width:0;flex:1}.name{display:flex;gap:7px;align-items:center}.name strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.username{color:var(--muted);font-size:.78rem}.bio{color:var(--muted);font-size:.82rem;line-height:1.55;margin:7px 0}.meta{color:var(--muted);font-size:.76rem;display:flex;gap:10px;flex-wrap:wrap}.actions2{display:flex;gap:7px;margin-top:11px}.actions2 .btn{flex:1;justify-content:center;font-size:.81rem;padding:7px}
.profile{display:none;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:19px;margin-bottom:18px}.profile.show{display:block}.profile-head{display:flex;gap:15px;align-items:flex-start}.profile-avatar{width:82px;height:82px;border-radius:17px;border:1px solid var(--border);object-fit:cover}.profile-body{flex:1;min-width:0}.profile-top{display:flex;justify-content:space-between;gap:12px}.profile-top h2{font-size:1.35rem}.profile-body p{color:var(--muted);line-height:1.6;margin:7px 0 10px}.pmeta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.78rem}.section{margin-top:17px}.section h3{font-size:1.05rem;margin-bottom:11px}.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:12px}.project{border:1px solid var(--border);border-radius:11px;padding:14px;background:var(--bg)}.project h4{margin-bottom:6px;word-break:break-word}.project p{color:var(--muted);font-size:.79rem;line-height:1.55;min-height:36px}.open{margin-top:10px}.empty{padding:45px 18px;text-align:center;border:1px dashed var(--border);border-radius:13px;background:var(--panel)}.empty i{font-size:34px;color:var(--accent);margin-bottom:11px}.empty p{color:var(--muted);margin-top:5px;line-height:1.6}.status{min-height:23px;color:var(--muted);font-size:.84rem;margin-bottom:10px}.loading{text-align:center;color:var(--muted);padding:26px}
@media(max-width:650px){header{padding:0 10px}.hide-mobile{display:none}main{padding:25px 12px 45px}.search{flex-direction:column}.search button{width:100%}.profile-head{flex-direction:column}.profile-top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="logo"><i class="fa-solid fa-code"></i><span>Codethd</span></div><div class="actions"><a class="btn" href="index.html"><i class="fa-solid fa-arrow-right"></i><span>المحرر</span></a><a class="btn" href="projects.html"><i class="fa-solid fa-folder-open"></i><span>مشاريعي</span></a><button class="btn" id="theme">🌙</button></div></header>
<main>
<section class="hero"><div class="hero-icon"><i class="fa-solid fa-user-group"></i></div><h1>مجتمع Codethd</h1><p>ابحث عن أصحابك، تابعهم، وشاهد مشاريعهم. كل شيء مشترك بين المستخدمين.</p></section>
<div class="search"><input id="q" placeholder="ابحث باسم المستخدم أو الاسم الظاهر أو المشروع..." autocomplete="off"><button id="searchBtn" class="btn primary"><i class="fa-solid fa-magnifying-glass"></i> بحث</button></div>
<div id="status" class="status"></div>
<section id="profile" class="profile"></section>
<section id="results" class="results"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="codethd-config.js?v=20260928.2"></script><script src="codethd-supabase.js?v=20260928.2"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id);
  const state=await CodeTHDCloud.ensureSession();
  if(!state){location.href='auth.html';return}
  const me=state.profile;
  const gradients=[
    'linear-gradient(135deg,#20c997,#0f766e,#111827)',
    'linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899)',
    'linear-gradient(135deg,#0ea5e9,#06b6d4,#14b8a6)',
    'linear-gradient(135deg,#f59e0b,#ef4444,#be185d)',
    'linear-gradient(135deg,#111827,#334155,#0f172a)',
    'linear-gradient(135deg,#22c55e,#84cc16,#15803d)'
  ];
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  async function personCard(u){
    const following=await CodeTHDCloud.isFollowing(u.id);
    const st=await CodeTHDCloud.stats(u.id);
    const bg=u.background||gradients[0];
    return '<article class="card" style="background:'+esc(bg)+';background-size:cover"><div style="margin:-16px;padding:16px;background:rgba(0,0,0,.28);min-height:170px"><div class="user"><div class="avatar" style="display:grid;place-items:center;background:rgba(255,255,255,.17);color:#fff;border-color:rgba(255,255,255,.3);font-size:24px">👤</div><div class="user-info"><div class="name"><strong style="color:#fff">'+esc(u.display_name||u.username)+'</strong><span class="username" style="color:rgba(255,255,255,.72)">@'+esc(u.username)+'</span></div><div class="bio" style="color:rgba(255,255,255,.84)">'+esc(u.bio||'عضو جديد في Codethd ✨')+'</div><div class="meta" style="color:rgba(255,255,255,.72)"><span>📁 '+st.projects+'</span><span>👥 '+st.followers+'</span></div></div></div><div class="actions2"><button class="btn primary profileBtn" data-id="'+u.id+'">الملف</button><button class="btn '+(following?'following':'')+' followBtn" data-id="'+u.id+'">'+(following?'✓ متابَع':'＋ متابعة')+'</button></div></div></article>';
  }
  async function openProfile(id){
    const u=id===me.id?me:await CodeTHDCloud.profile(id);if(!u)return;
    const [ps,st,following]=await Promise.all([CodeTHDCloud.peopleProjects('').then(async all=>all.filter(p=>p.user_id===id)),CodeTHDCloud.stats(id),id===me.id?false:CodeTHDCloud.isFollowing(id)]);
    const own=id===me.id, bg=u.background||gradients[0];
    $('profile').classList.add('show');$('profile').style.background=bg;
    $('profile').innerHTML='<div style="background:rgba(0,0,0,.34);padding:18px;border-radius:12px"><div class="profile-head"><div class="profile-avatar" style="display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff;font-size:33px;border-color:rgba(255,255,255,.35)">👤</div><div class="profile-body"><div class="profile-top"><div><h2 style="color:#fff">'+esc(u.display_name||u.username)+'</h2><div class="username" style="color:rgba(255,255,255,.74)">@'+esc(u.username)+'</div></div>'+(own?'':'<button class="btn '+(following?'following':'primary')+'" id="profileFollow">'+(following?'✓ متابَع':'＋ متابعة')+'</button>')+'</div><p style="color:rgba(255,255,255,.84)">'+esc(u.bio||'عضو في Codethd')+'</p><div class="pmeta" style="color:rgba(255,255,255,.75)"><span>📁 '+st.projects+' مشاريع</span><span>👥 '+st.followers+' متابع</span><span>➜ '+st.following+' يتابع</span></div></div></div>'+
    (own?'<div class="section"><h3 style="color:#fff">🎨 خلفية ملفك</h3><div style="display:flex;gap:8px;flex-wrap:wrap">'+gradients.map((g,i)=>'<button class="bgChoice" data-bg="'+esc(g)+'" style="width:52px;height:38px;border-radius:10px;border:2px solid '+(u.background===g?'#fff':'rgba(255,255,255,.35)')+';background:'+esc(g)+';cursor:pointer" aria-label="الخلفية '+(i+1)+'"></button>').join('')+'</div></div>':'')+
    '<div class="section"><h3 style="color:#fff">📁 المشاريع</h3><div class="projects">'+(ps.length?ps.map(p=>'<article class="project" style="background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.18);color:#fff"><h4>'+esc(p.name)+'</h4><p style="color:rgba(255,255,255,.75)">مشروع منشور داخل Codethd</p><button class="btn primary openProject" data-id="'+p.id+'">مشاهدة المشروع</button></article>').join(''):'<div class="empty" style="background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.2);color:#fff"><p style="color:rgba(255,255,255,.8)">لا توجد مشاريع منشورة بعد.</p></div>')+'</div></div></div>';
    if($('profileFollow'))$('profileFollow').onclick=async()=>{await CodeTHDCloud.toggleFollow(id);openProfile(id);render()};
    document.querySelectorAll('.bgChoice').forEach(b=>b.onclick=async()=>{await CodeTHDCloud.updateProfile({background:b.dataset.bg});const fresh=await CodeTHDCloud.profile(me.id);Object.assign(me,fresh||{});openProfile(me.id);});
    document.querySelectorAll('#profile .openProject').forEach(b=>b.onclick=()=>{localStorage.setItem('codethd-view-project-id',b.dataset.id);location.href='projects.html'});
    $('profile').scrollIntoView({behavior:'smooth',block:'start'});
  }
  async function render(){
    const q=$('q').value.trim();$('profile').classList.remove('show');$('status').textContent='جارٍ التحميل...';$('results').innerHTML='<div class="loading">✨ نبحث لك عن مجتمع Codethd...</div>';
    const people=q?await CodeTHDCloud.searchPeople(q):await CodeTHDCloud.allPeople();
    const projects=q?await CodeTHDCloud.peopleProjects(q):[];
    const followed=await CodeTHDCloud.followed();
    const followedIds=new Set(followed.map(x=>x.id));
    const cards=await Promise.all(people.map(personCard));
    const friendCards=await Promise.all(followed.filter(u=>people.some(p=>p.id===u.id)||!q).map(personCard));
    const projectCards=projects.map(p=>'<article class="card"><h3>'+esc(p.name)+'</h3><div class="username">بواسطة مستخدم Codethd</div><div class="actions2"><button class="btn primary openProject" data-id="'+p.id+'">مشاهدة المشروع</button></div></article>').join('');
    $('status').textContent=q?(people.length+projects.length)+' نتيجة':'اكتشف '+people.length+' أعضاء في Codethd';
    const uniqueFriendBlock=friendCards.length?'<div class="section-label">⭐ أصدقاؤك '+friendCards.length+'</div>'+friendCards.join(''):'';
    const otherBlock=cards.filter((_,i)=>!followedIds.has(people[i]?.id)).join('');
    $('results').innerHTML=(uniqueFriendBlock+otherBlock+projectCards)||'<div class="empty" style="grid-column:1/-1"><i class="fa-regular fa-face-frown"></i><h2>لا توجد نتائج</h2><p>جرّب اسمًا آخر.</p></div>';
    bind();
  }
  function bind(){document.querySelectorAll('.profileBtn').forEach(b=>b.onclick=()=>openProfile(b.dataset.id));document.querySelectorAll('.followBtn').forEach(b=>b.onclick=async()=>{b.disabled=true;await CodeTHDCloud.toggleFollow(b.dataset.id);render()});document.querySelectorAll('.openProject').forEach(b=>b.onclick=()=>{localStorage.setItem('codethd-view-project-id',b.dataset.id);location.href='projects.html'})}
  $('searchBtn').onclick=render;$('q').oninput=()=>render();$('q').onkeydown=e=>{if(e.key==='Enter')render()};
  $('theme').onclick=()=>{const light=document.body.classList.toggle('light');localStorage.setItem('codethd-theme',light?'light-mode':'dark-mode');$('theme').textContent=light?'☀️':'🌙'};
  const t=localStorage.getItem('codethd-theme')||'dark-mode';document.body.classList.toggle('light',t==='light-mode');$('theme').textContent=t==='light-mode'?'☀️':'🌙';
  render();
})();
</script>
</html>
