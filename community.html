<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأصدقاء والمطورون - Codethd</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#121212;--panel:#1e1e1e;--header:#181818;--text:#e0e0e0;--muted:#9ca3af;--border:#2a2a2a;--accent:#20c997;--accent-hover:#12b886;--danger:#ff6b6b;--soft:rgba(32,201,151,.10)}
body.light{--bg:#f8f9fa;--panel:#fff;--header:#e9ecef;--text:#212529;--muted:#6c757d;--border:#dee2e6;--accent:#0ca678;--accent-hover:#099268;--soft:rgba(12,166,120,.10)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{min-height:100vh;background:var(--bg);color:var(--text);transition:.3s}
header{height:64px;background:var(--header);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:1.25rem;font-weight:700}
.actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;background:var(--panel);color:var(--text);border:1px solid var(--border);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);color:#fff}
.btn.following{background:var(--soft);border-color:var(--accent);color:var(--accent)}
main{max-width:1150px;margin:0 auto;padding:34px 20px 60px}
.hero{text-align:center;margin-bottom:24px}
.hero-icon{width:74px;height:74px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:31px}
h1{font-size:2rem;margin-bottom:7px}
.hero p{color:var(--muted);font-size:.98rem}
.search-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.search-row{display:flex;gap:10px}
.search-box{position:relative;flex:1}
.search-box i{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-box input{width:100%;height:48px;padding:0 45px 0 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;font-size:1rem}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.search-btn{min-width:125px}
.hint{color:var(--muted);font-size:.8rem;margin-top:9px}
.tabs{display:flex;gap:8px;margin:0 0 18px}
.tab{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:8px;cursor:pointer;font-weight:700}
.tab.active{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.status{min-height:22px;color:var(--muted);font-size:.88rem;margin-bottom:12px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.user-card,.project-card,.profile{background:var(--panel);border:1px solid var(--border);border-radius:14px;transition:.2s}
.user-card{padding:16px;display:flex;gap:13px;align-items:flex-start}
.user-card:hover,.project-card:hover{border-color:rgba(32,201,151,.55);transform:translateY(-2px)}
.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:var(--bg)}
.user-info{min-width:0;flex:1}
.user-name{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.user-name strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.username{color:var(--muted);font-size:.82rem}
.bio{color:var(--muted);font-size:.83rem;line-height:1.55;margin:7px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.76rem}
.card-actions{display:flex;gap:8px;margin-top:10px}
.card-actions .btn{flex:1;padding:7px 9px;font-size:.82rem}
.profile{padding:20px;margin-bottom:18px;display:none}
.profile.show{display:block}
.profile-head{display:flex;gap:16px;align-items:flex-start}
.profile-avatar{width:86px;height:86px;border-radius:18px;object-fit:cover;border:1px solid var(--border)}
.profile-main{flex:1;min-width:0}
.profile-title{display:flex;align-items:center;justify-content:space-between;gap:12px}
.profile-title h2{font-size:1.35rem;margin-bottom:3px}
.profile-main p{color:var(--muted);line-height:1.55;margin:5px 0 10px}
.profile-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.82rem}
.profile-meta a{color:var(--accent);text-decoration:none}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px}
.section-title h2{font-size:1.15rem}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.project-card{padding:16px}
.project-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.project-icon{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--accent);flex:0 0 auto}
.project-card h3{font-size:1.02rem;margin-bottom:6px;word-break:break-word}
.project-card p{color:var(--muted);font-size:.82rem;line-height:1.55;min-height:40px}
.project-meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.76rem;margin:12px 0}
.project-meta span{display:inline-flex;align-items:center;gap:4px}
.empty{padding:50px 20px;text-align:center;border:1px dashed var(--border);border-radius:14px;background:var(--panel)}
.empty i{font-size:36px;color:var(--accent);margin-bottom:12px}
.empty h2{font-size:1.18rem;margin-bottom:7px}
.empty p{color:var(--muted);font-size:.9rem;line-height:1.6}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:28px;color:var(--muted)}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:20px;background:var(--accent);color:#fff;padding:10px 15px;border-radius:9px;font-weight:700;opacity:0;pointer-events:none;transform:translateY(8px);transition:.25s;z-index:30}
.toast.show{opacity:1;transform:none}
@media(max-width:700px){
 header{padding:0 11px}.hide-mobile{display:none}
 main{padding:25px 12px 45px}h1{font-size:1.6rem}
 .search-row{flex-direction:column}.search-btn{width:100%}
 .profile-head{flex-direction:column}.profile-title{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<header>
  <div class="logo"><i class="fa-solid fa-code"></i><span>Codethd</span></div>
  <div class="actions">
    <a class="btn" href="index.html"><i class="fa-solid fa-arrow-right"></i><span class="hide-mobile">العودة للمحرر</span></a>
    <a class="btn" href="projects.html"><i class="fa-solid fa-folder-open"></i><span class="hide-mobile">المشاريع</span></a>
    <button class="btn" id="themeBtn" title="تبديل المظهر">🌙</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-icon"><i class="fa-solid fa-user-group"></i></div>
    <h1>الأصدقاء والمطورون</h1>
    <p>ابحث عن صاحبك، افتح ملفه، وشاهد مشاريعه العامة ثم اضغط متابعة.</p>
  </section>

  <section class="search-wrap">
    <div class="search-row">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" type="search" placeholder="ابحث باسم المستخدم أو الاسم..." autocomplete="off">
      </div>
      <button class="btn primary search-btn" id="searchBtn"><i class="fa-solid fa-search"></i> بحث</button>
    </div>
    <div class="hint">البحث يستخدم حسابات GitHub العامة حتى تتمكن من رؤية مشاريع صاحبك الحقيقية.</div>
  </section>

  <div class="tabs">
    <button class="tab active" data-tab="search">البحث</button>
    <button class="tab" data-tab="following">أتابعهم <span id="followingCount">0</span></button>
  </div>

  <div id="status" class="status"></div>
  <section id="profile" class="profile"></section>
  <section id="results" class="results"></section>
  <section id="followingView" style="display:none">
    <div id="followingResults" class="results"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  const themeKey='codethd-theme';
  const followsKey='codethd-following';
  const api='https://api.github.com';
  const searchInput=document.getElementById('searchInput');
  const searchBtn=document.getElementById('searchBtn');
  const status=document.getElementById('status');
  const results=document.getElementById('results');
  const profile=document.getElementById('profile');
  const followingView=document.getElementById('followingView');
  const followingResults=document.getElementById('followingResults');
  const followingCount=document.getElementById('followingCount');
  const themeBtn=document.getElementById('themeBtn');
  const toast=document.getElementById('toast');

  function escapeHtml(value){
    return String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  function getFollowing(){
    try{return JSON.parse(localStorage.getItem(followsKey)||'[]')}catch(e){return[]}
  }
  function setFollowing(list){localStorage.setItem(followsKey,JSON.stringify(list));updateFollowingCount()}
  function isFollowing(login){return getFollowing().some(x=>x.login===login)}
  function updateFollowingCount(){followingCount.textContent=getFollowing().length}

  function applyTheme(){
    const theme=localStorage.getItem(themeKey)||'dark-mode';
    document.body.classList.toggle('light',theme==='light-mode');
    themeBtn.textContent=theme==='light-mode'?'☀️':'🌙';
  }
  themeBtn.addEventListener('click',()=>{
    const light=document.body.classList.contains('light');
    localStorage.setItem(themeKey,light?'dark-mode':'light-mode');
    applyTheme();
  });

  function showToast(message){
    toast.textContent=message;toast.classList.add('show');
    clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.remove('show'),1700);
  }

  function loading(target){
    target.innerHTML='<div class="loading"><span class="spinner"></span> جاري التحميل...</div>';
  }

  function userCard(user){
    const followed=isFollowing(user.login);
    return '<article class="user-card">'+
      '<img class="avatar" src="'+escapeHtml(user.avatar_url||'')+'" alt="">'+
      '<div class="user-info">'+
        '<div class="user-name"><strong>'+escapeHtml(user.name||user.login)+'</strong><span class="username">@'+escapeHtml(user.login)+'</span></div>'+
        '<div class="bio">'+escapeHtml(user.bio||'مطور على GitHub')+'</div>'+
        '<div class="meta"><span><i class="fa-solid fa-users"></i> '+Number(user.followers||0).toLocaleString('ar')+'</span><span><i class="fa-solid fa-code-branch"></i> '+Number(user.public_repos||0).toLocaleString('ar')+' مشروع</span></div>'+
        '<div class="card-actions"><button class="btn '+(followed?'following':'primary')+' profile-btn" data-login="'+escapeHtml(user.login)+'"><i class="fa-solid fa-user"></i> الملف</button><button class="btn follow-btn '+(followed?'following':'')+'" data-login="'+escapeHtml(user.login)+'"><i class="fa-solid fa-'+(followed?'check':'plus')+'"></i> '+(followed?'متابَع':'متابعة')+'</button></div>'+
      '</div>'+
    '</article>';
  }

  function repoCard(repo){
    const lang=repo.language||'Code';
    return '<article class="project-card">'+
      '<div class="project-head"><div><h3>'+escapeHtml(repo.name)+'</h3></div><div class="project-icon"><i class="fa-solid fa-code"></i></div></div>'+
      '<p>'+escapeHtml(repo.description||'لا يوجد وصف لهذا المشروع.')+'</p>'+
      '<div class="project-meta">'+
        '<span><i class="fa-solid fa-code"></i> '+escapeHtml(lang)+'</span>'+
        '<span><i class="fa-solid fa-star"></i> '+Number(repo.stargazers_count||0).toLocaleString('en')+'</span>'+
        '<span><i class="fa-solid fa-code-fork"></i> '+Number(repo.forks_count||0).toLocaleString('en')+'</span>'+
      '</div>'+
      '<a class="btn primary" href="'+escapeHtml(repo.html_url)+'" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> فتح المشروع</a>'+
    '</article>';
  }

  async function fetchJson(url){
    const response=await fetch(url,{headers:{'Accept':'application/vnd.github+json'}});
    if(!response.ok){
      if(response.status===403) throw new Error('تم الوصول إلى حد البحث المؤقت في GitHub. حاول لاحقًا.');
      if(response.status===404) throw new Error('لم يتم العثور على الحساب.');
      throw new Error('تعذر الاتصال بـ GitHub.');
    }
    return response.json();
  }

  async function searchUsers(){
    const q=searchInput.value.trim();
    if(!q){status.textContent='اكتب اسم المستخدم أو اسم الشخص أولًا.';results.innerHTML='';profile.classList.remove('show');return}
    profile.classList.remove('show');status.textContent='';loading(results);
    try{
      const data=await fetchJson(api+'/search/users?q='+encodeURIComponent(q)+'&per_page=12');
      if(!data.items||!data.items.length){
        status.textContent='لا توجد نتائج لهذا البحث.';
        results.innerHTML='';
        return;
      }
      const users=await Promise.all(data.items.slice(0,12).map(u=>fetchJson(api+'/users/'+encodeURIComponent(u.login)).catch(()=>u)));
      status.textContent='تم العثور على '+users.length+' حساب.';
      results.innerHTML=users.map(userCard).join('');
      bindUserActions();
    }catch(error){
      status.textContent=error.message;
      results.innerHTML='';
    }
  }

  function bindUserActions(){
    document.querySelectorAll('.profile-btn').forEach(btn=>btn.addEventListener('click',()=>openProfile(btn.dataset.login)));
    document.querySelectorAll('.follow-btn').forEach(btn=>btn.addEventListener('click',()=>{
      toggleFollow(btn.dataset.login);
      if(document.querySelector('.tab.active')?.dataset.tab==='following') renderFollowing();
      else searchUsers();
    }));
  }

  async function openProfile(login){
    profile.classList.add('show');loading(profile);results.innerHTML='';status.textContent='';
    try{
      const user=await fetchJson(api+'/users/'+encodeURIComponent(login));
      const repos=await fetchJson(api+'/users/'+encodeURIComponent(login)+'/repos?sort=updated&direction=desc&per_page=100&type=owner');
      const projects=repos.filter(r=>!r.fork);
      const followed=isFollowing(login);
      profile.innerHTML=
        '<div class="profile-head">'+
          '<img class="profile-avatar" src="'+escapeHtml(user.avatar_url||'')+'" alt="">'+
          '<div class="profile-main">'+
            '<div class="profile-title"><div><h2>'+escapeHtml(user.name||user.login)+'</h2><div class="username">@'+escapeHtml(user.login)+'</div></div>'+
            '<button id="profileFollow" class="btn '+(followed?'following':'primary')+'"><i class="fa-solid fa-'+(followed?'check':'plus')+'"></i> '+(followed?'متابَع':'متابعة')+'</button></div>'+
            '<p>'+escapeHtml(user.bio||'لا يوجد وصف لهذا الحساب.')+'</p>'+
            '<div class="profile-meta">'+
              '<span><i class="fa-solid fa-users"></i> '+Number(user.followers||0).toLocaleString('en')+' متابع</span>'+
              '<span><i class="fa-solid fa-user-plus"></i> '+Number(user.following||0).toLocaleString('en')+' يتابع</span>'+
              '<span><i class="fa-solid fa-folder-open"></i> '+projects.length.toLocaleString('en')+' مشروع عام</span>'+
              (user.location?'<span><i class="fa-solid fa-location-dot"></i> '+escapeHtml(user.location)+'</span>':'')+
              '<a href="'+escapeHtml(user.html_url)+'" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i> GitHub</a>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<div class="section-title"><h2>مشاريع '+escapeHtml(user.name||user.login)+'</h2><span class="username">'+projects.length+' مشروع</span></div>'+
        (projects.length?'<div class="projects-grid">'+projects.map(repoCard).join('')+'</div>':'<div class="empty"><i class="fa-regular fa-folder-open"></i><h2>لا توجد مشاريع عامة</h2><p>هذا الحساب لا يملك مستودعات عامة غير الفروع.</p></div>');
      document.getElementById('profileFollow').addEventListener('click',()=>{
        toggleFollow(login);
        openProfile(login);
      });
      window.scrollTo({top:document.querySelector('.profile').offsetTop-78,behavior:'smooth'});
    }catch(error){
      profile.innerHTML='<div class="empty"><i class="fa-solid fa-circle-exclamation"></i><h2>تعذر فتح الملف</h2><p>'+escapeHtml(error.message)+'</p></div>';
    }
  }

  function toggleFollow(login){
    const list=getFollowing();
    const index=list.findIndex(x=>x.login===login);
    if(index>=0){list.splice(index,1);showToast('تم إلغاء متابعة @'+login);}
    else{list.push({login});showToast('تمت متابعة @'+login);}
    setFollowing(list);
  }

  async function renderFollowing(){
    results.innerHTML='';profile.classList.remove('show');followingView.style.display='block';status.textContent='';
    const list=getFollowing();
    if(!list.length){
      followingResults.innerHTML='<div class="empty"><i class="fa-regular fa-user"></i><h2>لا تتابع أحدًا بعد</h2><p>ابحث عن صاحبك ثم اضغط متابعة ليظهر هنا.</p></div>';
      return;
    }
    loading(followingResults);
    const users=await Promise.all(list.map(x=>fetchJson(api+'/users/'+encodeURIComponent(x.login)).catch(()=>({login:x.login,avatar_url:'',bio:'تعذر تحميل الحساب'}))));
    followingResults.innerHTML=users.map(userCard).join('');
    bindUserActions();
  }

  document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');
    if(tab.dataset.tab==='following'){
      document.querySelector('.search-wrap').style.display='none';
      followingView.style.display='block';
      renderFollowing();
    }else{
      document.querySelector('.search-wrap').style.display='block';
      followingView.style.display='none';
      status.textContent='';
    }
  }));

  searchBtn.addEventListener('click',searchUsers);
  searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')searchUsers()});
  updateFollowingCount();
  applyTheme();
})();
</script>
</body>
</html>
