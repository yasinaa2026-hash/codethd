<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرر اللغة - Codethd</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/theme/material-darker.min.css">
<style>
:root{--bg:#121212;--panel:#1e1e1e;--header:#181818;--text:#e0e0e0;--muted:#9ca3af;--border:#2a2a2a;--accent:#20c997}
body.light{--bg:#f8f9fa;--panel:#fff;--header:#e9ecef;--text:#212529;--muted:#6c757d;--border:#dee2e6;--accent:#0ca678}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{min-height:100vh;background:var(--bg);color:var(--text);opacity:0;transform:translateX(12px);animation:pageIn .32s ease forwards}
body.page-exit{animation:pageOut .24s ease forwards}
@keyframes pageIn{to{opacity:1;transform:none}}@keyframes pageOut{to{opacity:0;transform:translateX(-12px)}}
header{height:64px;background:var(--header);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:1.2rem;font-weight:700}.actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:var(--panel);color:var(--text);border:1px solid var(--border);padding:8px 13px;border-radius:7px;cursor:pointer;font-weight:600;transition:.2s}.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:#ff6b6b}
main{height:calc(100vh - 64px);display:flex;flex-direction:column;padding:18px;gap:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{display:flex;align-items:center;gap:12px}.lang-icon{width:48px;height:48px;border-radius:12px;background:rgba(32,201,151,.11);color:var(--accent);display:grid;place-items:center;font-size:21px}.title h1{font-size:1.55rem}.title p{color:var(--muted);font-size:.83rem;margin-top:3px}.top-actions{display:flex;gap:8px}
.editor-wrap{min-height:0;flex:1;background:var(--panel);border:1px solid var(--border);border-radius:11px;overflow:hidden;display:flex;flex-direction:column}.editor-head{height:44px;flex:none;background:var(--header);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 12px;color:var(--muted);font-size:.85rem}.status{color:var(--muted)}#editor{flex:1;min-height:0}.CodeMirror{height:100%;font-size:15px;font-family:Consolas,'Fira Code','Courier New',monospace}
.toast{position:fixed;top:78px;left:18px;background:var(--accent);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:none}
@media(max-width:700px){header{padding:0 10px}.hide-mobile{display:none}main{padding:12px;height:calc(100vh - 64px)}.topbar{align-items:flex-start}.top-actions{flex-wrap:wrap}.title h1{font-size:1.25rem}}
</style>
</head>
<body>
<header>
<div class="logo"><i class="fa-solid fa-code"></i><span>Codethd</span></div>
<div class="actions"><a class="btn" id="backBtn" href="languages.html"><i class="fa-solid fa-arrow-right"></i><span class="hide-mobile">كل اللغات</span></a><button class="btn" id="themeBtn">🌙</button></div>
</header>
<main>
<div class="topbar">
<div class="title"><div class="lang-icon"><i class="fa-solid fa-code"></i></div><div><h1 id="languageName">لغة البرمجة</h1><p>مساحة مستقلة لهذه اللغة داخل Codethd</p></div></div>
<div class="top-actions"><button class="btn" id="copyBtn"><i class="fa-regular fa-copy"></i> نسخ</button><button class="btn primary" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> حفظ</button></div>
</div>
<div class="editor-wrap">
<div class="editor-head"><span><i class="fa-solid fa-terminal"></i> محرر <b id="headName"></b></span><span class="status" id="status">جاري التحميل...</span></div>
<div id="editor"><textarea id="source"></textarea></div>
</div>
</main>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/addon/mode/loadmode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/mode/meta.min.js"></script>
<script>
const params=new URLSearchParams(location.search);
const language=params.get('lang')||'HTML';
const languageName=document.getElementById('languageName'),headName=document.getElementById('headName'),status=document.getElementById('status'),toast=document.getElementById('toast'),themeBtn=document.getElementById('themeBtn');
languageName.textContent=language;headName.textContent=language;document.title=language+' - Codethd';
const samples={
HTML:'<!DOCTYPE html>\n<html>\n  <body>\n    <h1>Hello Codethd</h1>\n  </body>\n</html>',
CSS:'body {\n  font-family: sans-serif;\n  margin: 20px;\n}',
JavaScript:'function hello() {\n  console.log("Hello Codethd");\n}\n\nhello();',
TypeScript:'const message: string = "Hello Codethd";\nconsole.log(message);',
Python:'def hello():\n    print("Hello Codethd")\n\nhello()',
Java:'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello Codethd");\n    }\n}',
C:'#include <stdio.h>\n\nint main(void) {\n    printf("Hello Codethd\\n");\n    return 0;\n}',
'C++':'#include <iostream>\n\nint main() {\n    std::cout << "Hello Codethd\\n";\n    return 0;\n}',
'C#':'using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello Codethd");\n    }\n}',
Go:'package main\n\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hello Codethd")\n}',
Rust:'fn main() {\n    println!("Hello Codethd");\n}',
PHP:'<?php\necho "Hello Codethd";\n?>',
Ruby:'puts "Hello Codethd"',
SQL:'SELECT * FROM users WHERE active = 1;',
Bash:'echo "Hello Codethd"',
PowerShell:'Write-Host "Hello Codethd"',
JSON:'{\n  "name": "Codethd",\n  "version": "1.0"\n}',
XML:'<message>Hello Codethd</message>',
YAML:'name: Codethd\nversion: 1.0',
Markdown:'# Hello Codethd\n\nWrite your notes here.'
};
CodeMirror.modeURL='https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/mode/%N/%N.js';
let editor;
function show(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.remove('show'),1800)}
function findMode(){return CodeMirror.findModeByName?CodeMirror.findModeByName(language):null}
function applyMode(info){
  const mode=info?(info.mime||info.mode||'text/plain'):'text/plain';
  editor.setOption('mode',mode);
  status.textContent=info?'تلوين نحوي متاح':'وضع نصي عام';
}
function init(){
  const t=localStorage.getItem('codethd-theme')||'dark-mode';document.body.classList.toggle('light',t==='light-mode');themeBtn.textContent=t==='light-mode'?'☀️':'🌙';
  editor=CodeMirror.fromTextArea(document.getElementById('source'),{lineNumbers:true,lineWrapping:true,indentUnit:2,indentWithTabs:false,theme:'material-darker',mode:'text/plain',autoCloseBrackets:true,matchBrackets:true});
  const saved=localStorage.getItem('codethd-lang-'+language);editor.setValue(saved!==null?saved:(samples[language]||''));
  const info=findMode();
  if(info&&info.mode){try{CodeMirror.autoLoadMode(editor,info.mode);setTimeout(()=>applyMode(info),300)}catch(e){applyMode(info)}}else applyMode(info);
  document.getElementById('saveBtn').addEventListener('click',()=>{localStorage.setItem('codethd-lang-'+language,editor.getValue());show('تم حفظ '+language+' ✓')});
  document.getElementById('copyBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(editor.getValue());show('تم نسخ الكود ✓')}catch(e){show('تعذر النسخ') }});
  themeBtn.addEventListener('click',()=>{const light=document.body.classList.contains('light');document.body.classList.toggle('light',!light);localStorage.setItem('codethd-theme',light?'dark-mode':'light-mode');themeBtn.textContent=light?'🌙':'☀️'});
  document.getElementById('backBtn').addEventListener('click',e=>{e.preventDefault();document.body.classList.add('page-exit');setTimeout(()=>location.href='languages.html',220)});
}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init();
</script>
</body>
</html>
