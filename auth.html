<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تسجيل الدخول - Codethd</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#121212;--panel:#1e1e1e;--header:#181818;--text:#e0e0e0;--muted:#9ca3af;--border:#2a2a2a;--accent:#20c997;--hover:#12b886;--danger:#ff6b6b}
body.light{--bg:#f8f9fa;--panel:#fff;--header:#e9ecef;--text:#212529;--muted:#6c757d;--border:#dee2e6;--accent:#0ca678;--hover:#099268}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at top,rgba(32,201,151,.08),transparent 40%),var(--bg);color:var(--text);display:grid;place-items:center;padding:22px}
.card{width:min(450px,100%);background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.brand{text-align:center;color:var(--accent);font-size:1.45rem;font-weight:800;margin-bottom:22px}
.brand i{margin-left:7px}
.hero{text-align:center;margin-bottom:20px}.hero-icon{width:70px;height:70px;margin:0 auto 13px;border-radius:20px;background:rgba(32,201,151,.1);display:grid;place-items:center;color:var(--accent);font-size:29px}
h1{font-size:1.65rem;margin-bottom:7px}.hero p{color:var(--muted);font-size:.9rem;line-height:1.6}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0 16px}
.tab{height:42px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:9px;font-weight:800;cursor:pointer}.tab.active{background:rgba(32,201,151,.1);border-color:var(--accent);color:var(--accent)}
label{display:block;font-size:.84rem;font-weight:700;margin:13px 0 6px}
.input{width:100%;height:45px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);padding:0 12px;outline:none}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(32,201,151,.08)}
.primary{width:100%;height:45px;border:0;border-radius:9px;background:var(--accent);color:white;font-weight:800;font-size:.93rem;cursor:pointer;margin-top:17px}.primary:hover{background:var(--hover)}
.msg{min-height:23px;margin-top:12px;font-size:.84rem;line-height:1.5;color:var(--muted);text-align:center}.msg.error{color:var(--danger)}.msg.ok{color:var(--accent)}
.note{margin-top:14px;color:var(--muted);font-size:.75rem;line-height:1.6;text-align:center}
.theme{position:fixed;top:15px;left:15px;width:40px;height:40px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<button id="theme" class="theme">🌙</button>
<main class="card">
<div class="brand"><i class="fa-solid fa-code"></i> Codethd</div>
<section class="hero"><div class="hero-icon"><i class="fa-solid fa-user-lock"></i></div><h1 id="title">تسجيل الدخول</h1><p>أنشئ حسابك داخل Codethd وابنِ ملفك ومشاريعك وتابع أصدقاءك.</p></section>
<div class="tabs"><button class="tab active" id="loginTab">تسجيل الدخول</button><button class="tab" id="signupTab">إنشاء حساب</button></div>
<form id="form">
<div id="displayWrap" class="hidden"><label>اسمك الظاهر</label><input class="input" id="displayName" maxlength="80" autocomplete="name" placeholder="مثال: ياسين"></div>
<label>اسم المستخدم</label><input class="input" id="username" maxlength="30" minlength="3" autocomplete="username" required placeholder="مثال: yasin_dev">
<label>كلمة المرور</label><input class="input" id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="6 أحرف على الأقل">
<button class="primary" id="submit" type="submit">دخول</button>
</form>
<div id="msg" class="msg"></div>
<div class="note">اسم المستخدم هو الاسم الذي سيبحث به أصدقاؤك عنك داخل Codethd.</div>
</main>
<script src="supabase-config.js?v=20260928"></script>
<script>
(function(){
const U=window.CODETHD_SUPABASE_URL,K=window.CODETHD_SUPABASE_KEY;
const configured=U&&K;
const supabase=configured?window.supabase.createClient(U,K):null;
const $=id=>document.getElementById(id), msg=$('msg'), form=$('form'), submit=$('submit'), title=$('title');
let mode='login';
function setMsg(t,type=''){msg.textContent=t;msg.className='msg '+type}
function norm(v){return String(v||'').trim().toLowerCase()}
function authEmail(username){
  const bytes=new TextEncoder().encode(norm(username));let hex='';
  for(const b of bytes)hex+=b.toString(16).padStart(2,'0');
  return 'u-'+hex+'@auth.codethd.local';
}
function applyMode(){
  $('loginTab').classList.toggle('active',mode==='login');$('signupTab').classList.toggle('active',mode==='signup');
  $('displayWrap').classList.toggle('hidden',mode!=='signup');title.textContent=mode==='login'?'تسجيل الدخول':'إنشاء حساب';submit.textContent=mode==='login'?'دخول':'إنشاء الحساب';
  $('password').autocomplete=mode==='login'?'current-password':'new-password';setMsg('');
}
$('loginTab').onclick=()=>{mode='login';applyMode()};$('signupTab').onclick=()=>{mode='signup';applyMode()};
form.onsubmit=async e=>{
 e.preventDefault();if(!configured){setMsg('لم يتم ربط Supabase بعد. افتح supabase-config.js وضع رابط المشروع والمفتاح العام.','error');return}
 const username=norm($('username').value),password=$('password').value;
 if(!/^[a-z0-9_\u0600-\u06ff\u0750-\u077f.-]{3,30}$/i.test(username)){setMsg('اسم المستخدم يجب أن يكون من 3 إلى 30 حرفًا ويمكن أن يحتوي على حروف وأرقام و _ أو . أو - أو حروف عربية.','error');return}
 submit.disabled=true;setMsg(mode==='login'?'جارٍ تسجيل الدخول...':'جارٍ إنشاء الحساب...');
 try{
   if(mode==='login'){
     const {error}=await supabase.auth.signInWithPassword({email:authEmail(username),password});
     if(error)throw error;
     location.href='index.html';
   }else{
     const display=$('displayName').value.trim()||username;
     const {data,error}=await supabase.auth.signUp({email:authEmail(username),password,options:{data:{username,display_name:display}}});
     if(error)throw error;
     if(!data.session){setMsg('تم إنشاء الحساب، لكن إعداد تأكيد البريد مفعّل. عطّل Confirm Email في إعدادات Supabase ثم جرّب التسجيل مرة أخرى.','error');return}
     location.href='index.html';
   }
 }catch(error){
   const code=String(error?.code||'').toLowerCase();
   const text=String(error?.message||'').toLowerCase();
   if(code.includes('over_email_send_rate_limit')||text.includes('email rate limit')||text.includes('rate limit exceeded')){
     setMsg('تم تجاوز حد التسجيل/البريد مؤقتًا من Supabase. انتظر قليلًا ثم حاول مرة واحدة فقط. وإذا كان تأكيد البريد مفعّلًا، عطّله من Authentication → Settings → Confirm email.','error');
   }else if(code.includes('over_request_rate_limit')){
     setMsg('تم تجاوز حد الطلبات مؤقتًا. انتظر بضع دقائق ثم حاول مرة أخرى.','error');
   }else if(text.includes('user already registered')){
     setMsg('اسم المستخدم هذا مسجّل من قبل. اختر اسم مستخدم آخر أو استخدم تسجيل الدخول.','error');
   }else{
     setMsg(error.message||'حدث خطأ. حاول مرة أخرى.','error');
   }
 }finally{submit.disabled=false}
};
$('theme').onclick=()=>{const light=document.body.classList.toggle('light');localStorage.setItem('codethd-theme',light?'light-mode':'dark-mode');$('theme').textContent=light?'☀️':'🌙'};
const saved=localStorage.getItem('codethd-theme')||'dark-mode';document.body.classList.toggle('light',saved==='light-mode');$('theme').textContent=saved==='light-mode'?'☀️':'🌙';
})();
</script>
</body>
</html>
