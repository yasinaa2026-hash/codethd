<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تسجيل الدخول - Codethd</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#121212;--panel:#1e1e1e;--header:#181818;--text:#e0e0e0;--muted:#9ca3af;--border:#2a2a2a;--accent:#20c997;--hover:#12b886;--danger:#ff6b6b}
body.light{--bg:#f8f9fa;--panel:#fff;--header:#e9ecef;--text:#212529;--muted:#6c757d;--border:#dee2e6;--accent:#0ca678;--hover:#099268}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at top,rgba(32,201,151,.08),transparent 40%),var(--bg);color:var(--text);display:grid;place-items:center;padding:22px}
.card{width:min(450px,100%);background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.brand{text-align:center;color:var(--accent);font-size:1.45rem;font-weight:800;margin-bottom:22px}
.brand i{margin-left:7px}
.hero{text-align:center;margin-bottom:20px}.hero-icon{width:70px;height:70px;margin:0 auto 13px;border-radius:20px;background:rgba(32,201,151,.1);display:grid;place-items:center;color:var(--accent);font-size:29px}
h1{font-size:1.65rem;margin-bottom:7px}.hero p{color:var(--muted);font-size:.9rem;line-height:1.6}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0 16px}
.tab{height:42px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:9px;font-weight:800;cursor:pointer}.tab.active{background:rgba(32,201,151,.1);border-color:var(--accent);color:var(--accent)}
label{display:block;font-size:.84rem;font-weight:700;margin:13px 0 6px}
.input{width:100%;height:45px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);padding:0 12px;outline:none}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(32,201,151,.08)}
.primary{width:100%;height:45px;border:0;border-radius:9px;background:var(--accent);color:white;font-weight:800;font-size:.93rem;cursor:pointer;margin-top:17px}.primary:hover{background:var(--hover)}
.msg{min-height:23px;margin-top:12px;font-size:.84rem;line-height:1.5;color:var(--muted);text-align:center}.msg.error{color:var(--danger)}.msg.ok{color:var(--accent)}
.note{margin-top:14px;color:var(--muted);font-size:.75rem;line-height:1.6;text-align:center}
.theme{position:fixed;top:15px;left:15px;width:40px;height:40px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<button id="theme" class="theme">🌙</button>
<main class="card">
<div class="brand"><i class="fa-solid fa-code"></i> Codethd</div>
<section class="hero"><div class="hero-icon"><i class="fa-solid fa-user-lock"></i></div><h1 id="title">تسجيل الدخول</h1><p>أنشئ حسابك داخل Codethd وابنِ ملفك ومشاريعك وتابع أصدقاءك.</p></section>
<div class="tabs"><button class="tab active" id="quickTab">دخول سريع</button><button class="tab" id="howTab">كيف يعمل؟</button></div>
<form id="form">
<label>اسم المستخدم</label>
<input class="input" id="username" maxlength="30" minlength="3" autocomplete="username" required placeholder="مثال: yasin_dev">
<button class="primary" id="submit" type="submit">دخول إلى Codethd</button>
</form>
<div id="msg" class="msg"></div>
<div class="note">اكتب اسم المستخدم فقط. لا يوجد بريد ولا كلمة مرور. اسمك هو هويتك داخل Codethd.</div>
</main>
<script src="supabase-config.js?v=20260928.5"></script>
<script>
(function(){
const U=window.CODETHD_SUPABASE_URL,K=window.CODETHD_SUPABASE_KEY;
const configured=typeof U==='string'&&U.startsWith('https://')&&typeof K==='string'&&K.length>20;
const sb=configured?window.supabase.createClient(U,K):null;
const $=id=>document.getElementById(id);

function setMsg(text,type=''){ $('msg').textContent=text; $('msg').className='msg '+type; }
function norm(v){return String(v||'').trim().toLowerCase();}
function validUsername(v){return /^[a-z0-9_\\u0600-\\u06ff\\u0750-\\u077f.-]{3,30}$/i.test(v);}

async function getSession(){
  if(!sb) return null;
  const {data,error}=await sb.auth.getSession();
  return error?null:data.session;
}

async function getProfile(session){
  if(!session) return null;
  const {data}=await sb.from('profiles').select('id,username,display_name').eq('id',session.user.id).maybeSingle();
  return data||null;
}

async function continueWithUsername(username, displayName){
  const session=await getSession();
  if(session){
    const profile=await getProfile(session);
    if(!profile){
      setMsg('قاعدة بيانات Codethd غير جاهزة بعد. شغّل ملف supabase-schema.sql في Supabase ثم جرّب مرة أخرى.','error');
      return false;
    }
    if(norm(profile.username)===username) return true;
    const {data:used,error:lookupError}=await sb.from('profiles').select('id').eq('username_norm',username).maybeSingle();
    if(lookupError) throw lookupError;
    if(used && used.id!==session.user.id){
      setMsg('اسم المستخدم هذا مستخدم من شخص آخر. اختر اسمًا مختلفًا.','error');
      return false;
    }
    const {error}=await sb.from('profiles').update({
      username,
      username_norm:username,
      display_name:displayName||username
    }).eq('id',session.user.id);
    if(error) throw error;
    return true;
  }

  const {data,error}=await sb.auth.signInAnonymously({
    options:{data:{username,display_name:displayName||username}}
  });
  if(error) throw error;
  if(!data?.session?.user){
    throw new Error('لم يتم إنشاء حساب Codethd.');
  }

  const profile=await getProfile(data.session);
  if(!profile){
    await sb.auth.signOut();
    throw new Error('تمت جلسة الدخول، لكن قاعدة بيانات Codethd غير جاهزة. شغّل supabase-schema.sql أولًا.');
  }
  return true;
}

$('form').onsubmit=async e=>{
  e.preventDefault();
  if(!configured){setMsg('تعذر الاتصال بـ Codethd حاليًا. تحقق من إعدادات Supabase.','error');return}
  const raw=$('username').value.trim();
  const username=norm(raw);
  if(!validUsername(username)){
    setMsg('اسم المستخدم من 3 إلى 30 حرفًا ويمكن أن يحتوي على حروف وأرقام و _ أو . أو - .','error');
    return;
  }
  const displayName=raw;
  $('submit').disabled=true;
  setMsg('جارٍ دخولك إلى Codethd...');
  try{
    const ok=await continueWithUsername(username,displayName);
    if(ok) location.href='index.html';
  }catch(error){
    const t=String(error?.message||'').toLowerCase();
    if(t.includes('anonymous')||t.includes('disabled')){
      setMsg('فعّل Allow anonymous sign-ins من إعدادات Authentication في Supabase حتى يعمل الدخول بدون بريد وكلمة مرور.','error');
    }else if(t.includes('duplicate')||t.includes('unique')||t.includes('username_norm')){
      setMsg('اسم المستخدم مستخدم بالفعل. اختر اسمًا مختلفًا.','error');
    }else if(t.includes('rate limit')||Number(error?.status)===429){
      setMsg('تم الوصول لحد الطلبات مؤقتًا. انتظر قليلًا ثم جرّب مرة واحدة.','error');
    }else{
      setMsg(error?.message||'حدث خطأ. حاول مرة أخرى.','error');
    }
  }finally{
    $('submit').disabled=false;
  }
};

$('quickTab').onclick=()=>setMsg('اكتب اسم المستخدم فقط ثم ادخل. لا يوجد بريد ولا كلمة مرور.','ok');
$('howTab').onclick=()=>setMsg('Codethd يحفظ ملفك ومشاريعك واسمك داخل الموقع. نفس المتصفح يحافظ على جلستك تلقائيًا.','ok');
$('theme').onclick=()=>{
  const light=document.body.classList.toggle('light');
  localStorage.setItem('codethd-theme',light?'light-mode':'dark-mode');
  $('theme').textContent=light?'☀️':'🌙';
};
const saved=localStorage.getItem('codethd-theme')||'dark-mode';
document.body.classList.toggle('light',saved==='light-mode');
$('theme').textContent=saved==='light-mode'?'☀️':'🌙';

(async()=>{
  const session=await getSession();
  if(session){
    const profile=await getProfile(session);
    if(profile) $('username').value=profile.username||'';
  }
})();
})();
</script>
</body>
</html>
