<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08111f">
<title>الحساب — CodeTHD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="codethd-config.js?v=20261117.6"></script>
<script src="codethd-supabase.js?v=20261117.8"></script>
<link rel="stylesheet" href="codethd-brand.css?v=20261117.4">
<style>
:root{color-scheme:dark;--bg:#08111f;--panel:#101d30;--line:rgba(151,179,211,.17);--text:#ecf3fb;--muted:#9badc4;--accent:#54e0b0;--danger:#ff8585}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,rgba(84,224,176,.11),transparent 38%),var(--bg);font-family:Inter,"Segoe UI",Tahoma,sans-serif;color:var(--text)}
.card{width:min(470px,100%);border:1px solid var(--line);border-radius:22px;padding:27px;background:rgba(16,29,48,.96);box-shadow:0 24px 70px rgba(0,0,0,.3)}
.brand{text-align:center;color:var(--accent);font-weight:900;font-size:1.4rem;margin-bottom:20px}.brand i{margin-left:8px}
.hero{text-align:center;margin-bottom:21px}.heroIcon{margin:0 auto 12px;width:64px;height:64px;border-radius:19px;display:grid;place-items:center;background:rgba(84,224,176,.1);color:var(--accent);font-size:25px}
h1{font-size:1.55rem;margin:0 0 7px}.hero p{margin:0;color:var(--muted);font-size:.87rem;line-height:1.7}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0 16px}.tab{height:42px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);font-weight:800;cursor:pointer}.tab.active{border-color:var(--accent);background:rgba(84,224,176,.1);color:var(--accent)}
label{display:block;font-size:.83rem;font-weight:750;margin:13px 0 6px}.input{width:100%;height:45px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#0a1423;color:var(--text);outline:none}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(84,224,176,.08)}
.primary{width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:#062018;font-weight:900;font-size:.92rem;cursor:pointer;margin-top:17px}.primary:disabled{opacity:.6;cursor:wait}
.linkBtn{display:block;border:0;background:none;color:var(--accent);font-size:.8rem;font-weight:750;cursor:pointer;margin:12px auto 0}
.msg{min-height:24px;margin-top:12px;text-align:center;font-size:.83rem;line-height:1.6;color:var(--muted)}.msg.error{color:var(--danger)}.msg.ok{color:var(--accent)}
.note{margin-top:13px;text-align:center;color:var(--muted);font-size:.73rem;line-height:1.7}.hidden{display:none!important}
.back{display:block;text-align:center;margin-top:17px;color:var(--muted);text-decoration:none;font-size:.85rem}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><i class="fa-solid fa-code"></i> CodeTHD</div>
  <section class="hero">
    <div class="heroIcon"><i class="fa-solid fa-user-shield"></i></div>
    <h1 id="title">مرحبًا بك في CodeTHD</h1>
    <p id="subtitle">أنشئ حسابك واحتفظ بمشاريعك وملفك الشخصي في مكان واحد.</p>
  </section>
  <div class="tabs" id="tabs">
    <button class="tab active" id="loginTab" type="button">تسجيل الدخول</button>
    <button class="tab" id="signupTab" type="button">حساب جديد</button>
  </div>
  <form id="loginForm">
    <label for="loginEmail">البريد الإلكتروني أو اسم المستخدم القديم</label>
    <input class="input" id="loginEmail" type="text" autocomplete="username" required placeholder="name@example.com">
    <label for="loginPassword">كلمة المرور</label>
    <input class="input" id="loginPassword" type="password" minlength="8" autocomplete="current-password" required placeholder="8 أحرف على الأقل">
    <button class="primary" id="loginBtn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> دخول إلى المنصة</button>
    <button class="linkBtn" id="forgotBtn" type="button">نسيت كلمة المرور؟</button>
  </form>
  <form id="signupForm" class="hidden">
    <label for="signupEmail">البريد الإلكتروني</label>
    <input class="input" id="signupEmail" type="email" autocomplete="email" required placeholder="name@example.com">
    <label for="signupUsername">اسم المستخدم</label>
    <input class="input" id="signupUsername" maxlength="24" minlength="3" pattern="[A-Za-z0-9_]{3,24}" autocomplete="username" required placeholder="yasin_dev">
    <label for="displayName">الاسم الظاهر</label>
    <input class="input" id="displayName" maxlength="50" required placeholder="الاسم الذي يظهر للآخرين">
    <label for="signupPassword">كلمة المرور</label>
    <input class="input" id="signupPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="8 أحرف على الأقل">
    <button class="primary" id="signupBtn" type="submit"><i class="fa-solid fa-user-plus"></i> إنشاء الحساب</button>
  </form>
  <form id="resetForm" class="hidden">
    <label for="resetEmail">البريد الإلكتروني المرتبط بحسابك</label>
    <input class="input" id="resetEmail" type="email" autocomplete="email" required placeholder="name@example.com">
    <button class="primary" id="resetBtn" type="submit">إرسال رابط استعادة كلمة المرور</button>
    <button class="linkBtn" id="backLoginBtn" type="button">العودة لتسجيل الدخول</button>
  </form>
  <form id="recoveryForm" class="hidden">
    <label for="newPassword">كلمة المرور الجديدة</label>
    <input class="input" id="newPassword" type="password" minlength="8" required autocomplete="new-password">
    <label for="confirmPassword">تأكيد كلمة المرور</label>
    <input class="input" id="confirmPassword" type="password" minlength="8" required autocomplete="new-password">
    <button class="primary" id="savePasswordBtn" type="submit">حفظ كلمة المرور الجديدة</button>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="note">بعد تسجيل الدخول أو تأكيد البريد، ستعود إلى الصفحة الرئيسية. ومن هناك يمكنك فتح المحرر أو ملفك الشخصي.</div>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى الصفحة الرئيسية</a>
</main>
<script>
(async function(){
  const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),mode=params.get('mode')||'login';
  const msg=(text,type='')=>{$('msg').textContent=text;$('msg').className='msg '+type},home=()=>location.replace('index.html');
  const show=form=>['loginForm','signupForm','resetForm','recoveryForm'].forEach(id=>$(id).classList.toggle('hidden',id!==form));
  function tab(login){
    $('loginTab').classList.toggle('active',login);$('signupTab').classList.toggle('active',!login);
    show(login?'loginForm':'signupForm');$('title').textContent=login?'مرحبًا بعودتك':'أنشئ حسابك في CodeTHD';
    $('subtitle').textContent=login?'سجّل الدخول للعودة إلى مساحتك البرمجية.':'أدخل بريدًا حقيقيًا لتأكيد الحساب واستعادة كلمة المرور عند الحاجة.';msg('');
  }
  $('loginTab').onclick=()=>tab(true);$('signupTab').onclick=()=>tab(false);
  $('forgotBtn').onclick=()=>{show('resetForm');$('title').textContent='استعادة كلمة المرور';$('subtitle').textContent='سنرسل رابطًا إلى بريدك الإلكتروني لتعيين كلمة مرور جديدة.';msg('')};
  $('backLoginBtn').onclick=()=>tab(true);
  if(mode==='signup')tab(false);
  if(mode==='recovery'){$('tabs').classList.add('hidden');show('recoveryForm');$('title').textContent='كلمة مرور جديدة';$('subtitle').textContent='اكتب كلمة مرور جديدة لحسابك.'}
  // Keep the form interactive immediately; session restoration must never block form handlers.
  if(!window.CodeTHDCloud){
    msg('تعذّر تحميل خدمة الحسابات. حدّث الصفحة، وإذا استمرت المشكلة تحقق من اتصال الإنترنت.','error');
    ['loginBtn','signupBtn','resetBtn','savePasswordBtn'].forEach(id=>{const el=$(id);if(el)el.disabled=true});
    return;
  }
  window.CodeTHDCloud.ensureSession()
    .then(state=>{if(state&&mode!=='recovery')home()})
    .catch(error=>console.warn('Session restore failed; sign-in form remains available:',error));
  $('loginForm').onsubmit=async e=>{
    e.preventDefault();const b=$('loginBtn');b.disabled=true;msg('جارٍ تسجيل الدخول...');
    try{await CodeTHDCloud.signIn($('loginEmail').value,$('loginPassword').value);msg('تم تسجيل الدخول بنجاح ✓','ok');setTimeout(home,250)}
    catch(err){msg(CodeTHDCloud.errorText(err),'error')}finally{b.disabled=false}
  };
  $('signupForm').onsubmit=async e=>{
    e.preventDefault();const b=$('signupBtn');b.disabled=true;msg('جارٍ إنشاء حسابك...');
    try{
      const result=await CodeTHDCloud.signUp($('signupEmail').value,$('signupUsername').value,$('signupPassword').value,$('displayName').value);
      if(result.needsEmailConfirmation){msg('أُنشئ الحساب. افتح بريدك الإلكتروني واضغط رابط التأكيد، ثم ستنتقل إلى الصفحة الرئيسية.','ok');$('signupForm').reset()}
      else{msg('تم إنشاء حسابك ✓','ok');setTimeout(home,350)}
    }catch(err){msg(CodeTHDCloud.errorText(err),'error')}finally{b.disabled=false}
  };
  $('resetForm').onsubmit=async e=>{
    e.preventDefault();const b=$('resetBtn');b.disabled=true;msg('جارٍ إرسال الرابط...');
    try{await CodeTHDCloud.requestPasswordReset($('resetEmail').value);msg('إن كان البريد مسجلًا، ستصلك رسالة تحتوي على رابط آمن لإعادة تعيين كلمة المرور.','ok')}
    catch(err){msg(CodeTHDCloud.errorText(err),'error')}finally{b.disabled=false}
  };
  $('recoveryForm').onsubmit=async e=>{
    e.preventDefault();const p=$('newPassword').value;if(p!==$('confirmPassword').value){msg('كلمتا المرور غير متطابقتين.','error');return}
    const b=$('savePasswordBtn');b.disabled=true;msg('جارٍ تحديث كلمة المرور...');
    try{await CodeTHDCloud.updatePassword(p);msg('تم تحديث كلمة المرور. سيتم تحويلك إلى الصفحة الرئيسية.','ok');setTimeout(home,650)}
    catch(err){msg(CodeTHDCloud.errorText(err),'error')}finally{b.disabled=false}
  };
})();
</script>
</body>
</html>
