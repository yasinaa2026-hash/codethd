<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>حسابك - Codethd</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="codethd-config.js?v=20260928.2"></script>
<script src="codethd-supabase.js?v=20260928.4"></script>
<style>
:root{--bg:#121212;--panel:#1e1e1e;--header:#181818;--text:#e0e0e0;--muted:#9ca3af;--border:#2a2a2a;--accent:#20c997;--hover:#12b886;--danger:#ff6b6b}
body.light{--bg:#f8f9fa;--panel:#fff;--header:#e9ecef;--text:#212529;--muted:#6c757d;--border:#dee2e6;--accent:#0ca678;--hover:#099268}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at top,rgba(32,201,151,.08),transparent 40%),var(--bg);color:var(--text);display:grid;place-items:center;padding:22px}
.card{width:min(450px,100%);background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.brand{text-align:center;color:var(--accent);font-size:1.45rem;font-weight:800;margin-bottom:22px}
.brand i{margin-left:7px}
.hero{text-align:center;margin-bottom:20px}.hero-icon{width:70px;height:70px;margin:0 auto 13px;border-radius:20px;background:rgba(32,201,151,.1);display:grid;place-items:center;color:var(--accent);font-size:29px}
h1{font-size:1.65rem;margin-bottom:7px}.hero p{color:var(--muted);font-size:.9rem;line-height:1.6}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0 16px}
.tab{height:42px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:9px;font-weight:800;cursor:pointer}.tab.active{background:rgba(32,201,151,.1);border-color:var(--accent);color:var(--accent)}
label{display:block;font-size:.84rem;font-weight:700;margin:13px 0 6px}
.input{width:100%;height:45px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);padding:0 12px;outline:none}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(32,201,151,.08)}
.primary{width:100%;height:45px;border:0;border-radius:9px;background:var(--accent);color:white;font-weight:800;font-size:.93rem;cursor:pointer;margin-top:17px}.primary:hover{background:var(--hover)}
.msg{min-height:23px;margin-top:12px;font-size:.84rem;line-height:1.5;color:var(--muted);text-align:center}.msg.error{color:var(--danger)}.msg.ok{color:var(--accent)}
.note{margin-top:14px;color:var(--muted);font-size:.75rem;line-height:1.6;text-align:center}
.theme{position:fixed;top:15px;left:15px;width:40px;height:40px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<button id="theme" class="theme" type="button">🌙</button>
<main class="card">
  <div class="brand"><i class="fa-solid fa-code"></i> Codethd</div>
  <section class="hero">
    <div class="hero-icon"><i class="fa-solid fa-user-circle"></i></div>
    <h1>حسابك جاهز 🎉</h1>
    <p>لا بريد إلكتروني، لا Supabase، ولا إعدادات خارجية. اختر اسمك وادخل مباشرة إلى Codethd.</p>
  </section>
  <div class="tabs">
  <button class="tab active" id="loginTab" type="button">تسجيل الدخول</button>
  <button class="tab" id="signupTab" type="button">حساب جديد</button>
</div>
<div id="loginBox">
  <form id="loginForm">
    <label>اسم المستخدم</label><input class="input" id="loginUsername" maxlength="24" autocomplete="username" required placeholder="yasin_dev">
    <label>كلمة المرور</label><input class="input" id="loginPassword" type="password" minlength="8" autocomplete="current-password" required placeholder="••••••••">
    <button class="primary" id="loginBtn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
  </form>
</div>
<div id="signupBox" class="hidden">
  <form id="signupForm">
    <label>اسم المستخدم</label><input class="input" id="signupUsername" maxlength="24" autocomplete="username" required placeholder="yasin_dev">
    <label>الاسم الظاهر</label><input class="input" id="displayName" maxlength="50" required placeholder="Yasin">
    <label>كلمة المرور</label><input class="input" id="signupPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="8 أحرف على الأقل">
    <button class="primary" id="signupBtn" type="submit"><i class="fa-solid fa-user-plus"></i> إنشاء الحساب</button>
  </form>
</div>
  <div id="msg" class="msg"></div>
  <div class="note">حسابك محفوظ في Codethd، وستبقى مسجل الدخول عند عودتك للموقع.</div>
  <a href="index.html" class="tab" style="display:block;text-align:center;text-decoration:none;margin-top:12px">فتح المحرر مباشرة</a>
</main>
<script>
(async function(){
const $=id=>document.getElementById(id);
function msg(t,type=''){ $('msg').textContent=t; $('msg').className='msg '+type; }
function switchTab(login){$('loginTab').classList.toggle('active',login);$('signupTab').classList.toggle('active',!login);$('loginBox').classList.toggle('hidden',!login);$('signupBox').classList.toggle('hidden',login);msg('')}
$('loginTab').onclick=()=>switchTab(true);$('signupTab').onclick=()=>switchTab(false);
try{
  const s=await CodeTHDCloud.ensureSession();
  if(s){$('loginUsername').value=s.profile.username||'';msg('أنت مسجل الدخول بالفعل ✓','ok');setTimeout(()=>location.href='index.html',300)}
}catch(e){console.warn(e)}
$('loginForm').onsubmit=async e=>{e.preventDefault();const b=$('loginBtn');b.disabled=true;msg('جارٍ تسجيل الدخول...');try{await CodeTHDCloud.signIn($('loginUsername').value,$('loginPassword').value);msg('تم الدخول ✓','ok');setTimeout(()=>location.href='index.html',250)}catch(e){msg(CodeTHDCloud.errorText(e),'error')}finally{b.disabled=false}};
$('signupForm').onsubmit=async e=>{e.preventDefault();const b=$('signupBtn');b.disabled=true;msg('جارٍ إنشاء حسابك...');try{await CodeTHDCloud.signUp($('signupUsername').value,$('signupPassword').value,$('displayName').value);msg('تم إنشاء الحساب 🎉','ok');setTimeout(()=>location.href='index.html',350)}catch(e){msg(CodeTHDCloud.errorText(e),'error')}finally{b.disabled=false}};
$('theme').onclick=()=>{const light=document.body.classList.toggle('light');localStorage.setItem('codethd-theme',light?'light-mode':'dark-mode');$('theme').textContent=light?'☀️':'🌙'};
const t=localStorage.getItem('codethd-theme')||'dark-mode';document.body.classList.toggle('light',t==='light-mode');$('theme').textContent=t==='light-mode'?'☀️':'🌙';
})();
</script>
</body>
</html>
