<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاريع Codethd</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary:#121212;
            --bg-secondary:#1e1e1e;
            --bg-header:#181818;
            --text-main:#e0e0e0;
            --muted:#9ca3af;
            --border:#2a2a2a;
            --accent:#20c997;
            --accent-hover:#12b886;
            --danger:#ff6b6b;
        }
        body.light-mode {
            --bg-primary:#f8f9fa;
            --bg-secondary:#fff;
            --bg-header:#e9ecef;
            --text-main:#212529;
            --muted:#6c757d;
            --border:#dee2e6;
            --accent:#0ca678;
            --accent-hover:#099268;
        }
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
        body{min-height:100vh;background:var(--bg-primary);color:var(--text-main);transition:.3s}
        header{height:64px;background:var(--bg-header);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}
        .logo{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:1.25rem;font-weight:700}
        .actions{display:flex;gap:8px;align-items:center}
        .btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:var(--bg-secondary);color:var(--text-main);border:1px solid var(--border);padding:8px 13px;border-radius:7px;cursor:pointer;font-weight:600;transition:.2s}
        .btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
        .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
        .btn.primary:hover{background:var(--accent-hover);color:#fff}
        .btn.danger{color:var(--danger)}
        .btn.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
        main{max-width:1100px;margin:0 auto;padding:38px 20px 60px}
        .hero{text-align:center;margin-bottom:30px}
        .hero-icon{width:76px;height:76px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;background:rgba(32,201,151,.12);color:var(--accent);font-size:32px}
        h1{font-size:2rem;margin-bottom:8px}
        .hero p{color:var(--muted);font-size:1rem}
        .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
        .count{color:var(--muted);font-size:.9rem}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
        .card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;padding:18px;transition:.2s}
        .card:hover{border-color:rgba(32,201,151,.55);transform:translateY(-2px)}
        .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
        .project-icon{width:44px;height:44px;border-radius:10px;background:rgba(32,201,151,.1);display:grid;place-items:center;color:var(--accent);font-size:20px}
        .card h3{font-size:1.05rem;margin-bottom:5px}
        .date{color:var(--muted);font-size:.78rem}
        .preview{height:105px;border:1px solid var(--border);border-radius:8px;background:#fff;overflow:hidden;margin-bottom:15px}
        .preview iframe{width:100%;height:100%;border:0;background:#fff}
        .card-actions{display:flex;gap:8px}
        .card-actions .btn{flex:1;justify-content:center}
        .empty{padding:55px 20px;text-align:center;border:1px dashed var(--border);border-radius:12px;background:var(--bg-secondary)}
        .empty i{font-size:38px;color:var(--accent);margin-bottom:14px}
        .empty h2{margin-bottom:8px;font-size:1.25rem}
        .empty p{color:var(--muted);margin-bottom:18px}
        @media(max-width:600px){
            header{padding:0 12px}
            .hide-mobile{display:none}
            main{padding:28px 14px 45px}
            h1{font-size:1.6rem}
            .toolbar{align-items:stretch;flex-direction:column}
        }
    </style>
</head>
<body>
<header>
    <div class="logo"><i class="fa-solid fa-code"></i><span>Codethd</span></div>
    <div class="actions">
        <a class="btn" href="index.html"><i class="fa-solid fa-arrow-right"></i><span class="hide-mobile">العودة للمحرر</span></a>
        <button class="btn" id="themeBtn" title="تبديل المظهر">🌙</button>
    </div>
</header>

<main>
    <section class="hero">
        <div class="hero-icon"><i class="fa-solid fa-folder-open"></i></div>
        <h1>مشاريعي</h1>
        <p>احفظ مشاريعك وارجع لها في أي وقت من نفس المتصفح.</p>
    </section>

    <div class="toolbar">
        <span class="count" id="count"></span>
        <button class="btn primary" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> حفظ المشروع الحالي</button>
    </div>

    <div id="projects"></div>
</main>

<script>
(function(){
    const projectKey='codethd-projects';
    const themeKey='codethd-theme';
    const projectsEl=document.getElementById('projects');
    const countEl=document.getElementById('count');
    const themeBtn=document.getElementById('themeBtn');

    function applyTheme(){
        const theme=localStorage.getItem(themeKey)||'dark-mode';
        document.body.classList.toggle('light-mode',theme==='light-mode');
        themeBtn.textContent=theme==='light-mode'?'☀️':'🌙';
    }

    themeBtn.addEventListener('click',()=>{
        const light=document.body.classList.contains('light-mode');
        localStorage.setItem(themeKey,light?'dark-mode':'light-mode');
        applyTheme();
    });

    function getProjects(){
        try{return JSON.parse(localStorage.getItem(projectKey)||'[]')}catch(e){return []}
    }

    function escapeHtml(value){
        return String(value||'').replace(/[&<>"']/g,function(c){
            return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c];
        });
    }

    function render(){
        const projects=getProjects();
        countEl.textContent=projects.length ? projects.length+' مشروع' : 'لا توجد مشاريع محفوظة';

        if(!projects.length){
            projectsEl.innerHTML='<div class="empty"><i class="fa-regular fa-folder-open"></i><h2>لا توجد مشاريع بعد</h2><p>افتح المحرر، اكتب مشروعك، ثم اضغط هنا لحفظه.</p><a class="btn primary" href="index.html"><i class="fa-solid fa-code"></i> فتح المحرر</a></div>';
            return;
        }

        const grid=document.createElement('div');
        grid.className='grid';

        projects.forEach((project,index)=>{
            const card=document.createElement('article');
            card.className='card';

            const srcdoc='<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif;padding:12px;margin:0}'+(project.css||'')+'</style></head><body>'+(project.html||'')+'<script>'+(project.js||'').replace(/<\\/script>/gi,'')+'<\\/script></body></html>';

            card.innerHTML=
                '<div class="card-top"><div><h3>'+escapeHtml(project.name)+'</h3><div class="date">'+escapeHtml(project.date)+'</div></div><div class="project-icon"><i class="fa-solid fa-code"></i></div></div>'+
                '<div class="preview"><iframe sandbox="allow-scripts" title="معاينة المشروع"></iframe></div>'+
                '<div class="card-actions"><button class="btn primary open" data-index="'+index+'"><i class="fa-solid fa-pen"></i> فتح</button><button class="btn danger delete" data-index="'+index+'"><i class="fa-solid fa-trash"></i> حذف</button></div>';

            card.querySelector('iframe').srcdoc=srcdoc;
            grid.appendChild(card);
        });

        projectsEl.innerHTML='';
        projectsEl.appendChild(grid);

        projectsEl.querySelectorAll('.open').forEach(btn=>{
            btn.addEventListener('click',()=>{
                const project=getProjects()[Number(btn.dataset.index)];
                if(!project)return;
                localStorage.setItem('codethd-html',project.html||'');
                localStorage.setItem('codethd-css',project.css||'');
                localStorage.setItem('codethd-js',project.js||'');
                window.location.href='index.html';
            });
        });

        projectsEl.querySelectorAll('.delete').forEach(btn=>{
            btn.addEventListener('click',()=>{
                const projects=getProjects();
                const index=Number(btn.dataset.index);
                if(confirm('هل تريد حذف هذا المشروع؟')){
                    projects.splice(index,1);
                    localStorage.setItem(projectKey,JSON.stringify(projects));
                    render();
                }
            });
        });
    }

    document.getElementById('saveBtn').addEventListener('click',()=>{
        const html=localStorage.getItem('codethd-html')||'';
        const css=localStorage.getItem('codethd-css')||'';
        const js=localStorage.getItem('codethd-js')||'';

        if(!html.trim() && !css.trim() && !js.trim()){
            alert('لا يوجد كود محفوظ لحفظه كمشروع.');
            return;
        }

        const name=prompt('اكتب اسم المشروع:','مشروع Codethd');
        if(name===null)return;

        const projects=getProjects();
        projects.unshift({
            name:name.trim()||'مشروع بدون اسم',
            html,css,js,
            date:new Date().toLocaleString('ar-SA')
        });
        localStorage.setItem(projectKey,JSON.stringify(projects));
        render();
    });

    applyTheme();
    render();
})();
</script>
</body>
</html>
