<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>مشاريعي - Codethd</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260928"></script>
<style>
:root{--bg:#121212;--panel:#1e1e1e;--header:#181818;--text:#e0e0e0;--muted:#9ca3af;--border:#2a2a2a;--accent:#20c997;--hover:#12b886;--danger:#ff6b6b}
body.light{--bg:#f8f9fa;--panel:#fff;--header:#e9ecef;--text:#212529;--muted:#6c757d;--border:#dee2e6;--accent:#0ca678;--hover:#099268}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}body{min-height:100vh;background:var(--bg);color:var(--text)}
header{height:64px;background:var(--header);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}.logo{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:1.2rem;font-weight:800}.actions{display:flex;gap:7px;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;background:var(--panel);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.btn.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
main{max-width:1120px;margin:0 auto;padding:34px 20px 60px}.hero{text-align:center;margin-bottom:25px}.hero-icon{width:74px;height:74px;border-radius:20px;background:rgba(32,201,151,.1);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px;font-size:31px}h1{font-size:1.95rem;margin-bottom:7px}.hero p{color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.count{color:var(--muted);font-size:.85rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:16px}.card:hover{border-color:rgba(32,201,151,.55);transform:translateY(-2px);transition:.2s}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:13px}.icon{width:43px;height:43px;border-radius:10px;background:rgba(32,201,151,.1);display:grid;place-items:center;color:var(--accent)}h3{font-size:1.03rem;margin-bottom:5px;word-break:break-word}.date{color:var(--muted);font-size:.76rem}.preview{height:120px;background:#fff;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin:10px 0 13px}.preview iframe{width:100%;height:100%;border:0}.card-actions{display:flex;gap:7px}.card-actions .btn{flex:1}.empty{padding:50px 20px;text-align:center;border:1px dashed var(--border);border-radius:13px;background:var(--panel)}.empty i{font-size:36px;color:var(--accent);margin-bottom:12px}.empty h2{font-size:1.18rem;margin-bottom:6px}.empty p{color:var(--muted);line-height:1.6;margin-bottom:15px}.msg{color:var(--muted);font-size:.84rem;min-height:23px;margin-bottom:9px}.loading{text-align:center;color:var(--muted);padding:30px}
@media(max-width:650px){header{padding:0 10px}.hide-mobile{display:none}main{padding:27px 12px 45px}.toolbar{align-items:stretch;flex-direction:column}}
</style>
</head>
<body>
<header><div class="logo"><i class="fa-solid fa-code"></i><span>Codethd</span></div><div class="actions"><a class="btn" href="community.html"><i class="fa-solid fa-user-group"></i><span class="hide-mobile">الأصدقاء</span></a><a class="btn" href="index.html"><i class="fa-solid fa-code"></i><span class="hide-mobile">المحرر</span></a><button class="btn" id="logout"><i class="fa-solid fa-right-from-bracket"></i><span class="hide-mobile">خروج</span></button><button class="btn" id="theme">🌙</button></div></header>
<main><section class="hero"><div class="hero-icon"><i class="fa-solid fa-folder-open"></i></div><h1>مشاريعي</h1><p>مشاريعك محفوظة في حساب Codethd وتستطيع فتحها من أي جهاز بعد تسجيل الدخول.</p></section>
<div class="toolbar"><span class="count" id="count"></span><a class="btn primary" href="index.html"><i class="fa-solid fa-plus"></i> مشروع جديد</a></div><div id="msg" class="msg"></div><section id="projects"></section></main>
<script>
(async function(){
const U=window.CODETHD_SUPABASE_URL,K=window.CODETHD_SUPABASE_KEY;if(!U||!K){location.href='auth.html';return}
const sb=window.supabase.createClient(U,K);const {$}=window;
const {data:{session}}=await sb.auth.getSession();if(!session){location.href='auth.html';return}
const projectsEl=document.getElementById('projects'),countEl=document.getElementById('count'),msg=document.getElementById('msg');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function getProjects(){const {data,error}=await sb.from('projects').select('id,name,html,css,js,updated_at').eq('user_id',session.user.id).order('updated_at',{ascending:false});if(error){msg.textContent='تعذر تحميل المشاريع: '+error.message;return []}return data||[]}
async function render(){
 projectsEl.innerHTML='<div class="loading">جاري تحميل مشاريعك...</div>';const list=await getProjects();countEl.textContent=list.length+' مشروع';
 if(!list.length){projectsEl.innerHTML='<div class="empty"><i class="fa-regular fa-folder-open"></i><h2>لا توجد مشاريع بعد</h2><p>افتح المحرر وأنشئ مشروعك ثم اضغط حفظ.</p><a class="btn primary" href="index.html"><i class="fa-solid fa-code"></i> فتح المحرر</a></div>';return}
 const grid=document.createElement('div');grid.className='grid';
 list.forEach((p,index)=>{const card=document.createElement('article');card.className='card';const srcdoc='<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;font-family:Arial,sans-serif}'+(p.css||'')+'</style></head><body>'+(p.html||'')+'<script>'+String(p.js||'').replace(/<\\/script>/gi,'')+'<\\/script></body></html>';
 card.innerHTML='<div class="top"><div><h3>'+esc(p.name)+'</h3><div class="date">'+new Date(p.updated_at).toLocaleString('ar-SA')+'</div></div><div class="icon"><i class="fa-solid fa-code"></i></div></div><div class="preview"><iframe sandbox="allow-scripts" title="معاينة"></iframe></div><div class="card-actions"><button class="btn primary open" data-id="'+esc(p.id)+'"><i class="fa-solid fa-pen"></i> فتح</button><button class="btn danger delete" data-id="'+esc(p.id)+'"><i class="fa-solid fa-trash"></i> حذف</button></div>';
 card.querySelector('iframe').srcdoc=srcdoc;grid.appendChild(card)});
 projectsEl.innerHTML='';projectsEl.appendChild(grid);
 grid.querySelectorAll('.open').forEach(b=>b.onclick=()=>{localStorage.setItem('codethd-active-project-id',b.dataset.id);location.href='index.html'});
 grid.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(!confirm('هل تريد حذف هذا المشروع؟'))return;const {error}=await sb.from('projects').delete().eq('id',b.dataset.id).eq('user_id',session.user.id);if(error){msg.textContent='تعذر الحذف: '+error.message}else{localStorage.removeItem('codethd-active-project-id');render()}});
}
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='auth.html'};
document.getElementById('theme').onclick=()=>{const light=document.body.classList.toggle('light');localStorage.setItem('codethd-theme',light?'light-mode':'dark-mode');document.getElementById('theme').textContent=light?'☀️':'🌙'};
const t=localStorage.getItem('codethd-theme')||'dark-mode';document.body.classList.toggle('light',t==='light-mode');document.getElementById('theme').textContent=t==='light-mode'?'☀️':'🌙';
render();
})();
</script></body></html>
