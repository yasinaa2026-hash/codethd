<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08111f"><title>حسابي — CodeTHD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="codethd-config.js?v=20261117.6"></script>
<script src="codethd-supabase.js?v=20261117.6"></script>
<link rel="stylesheet" href="codethd-brand.css?v=20261117.4">
<style>
:root{--bg:#08111f;--panel:#101d30;--line:rgba(151,179,211,.17);--text:#ecf3fb;--muted:#9badc4;--accent:#54e0b0;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(84,224,176,.08),transparent 38%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Tahoma,sans-serif}
.wrap{width:min(850px,calc(100% - 30px));margin:auto}.top{min-height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{color:var(--accent);font-size:1.2rem;font-weight:950;text-decoration:none}.brand i{margin-left:7px}.nav{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:0 14px;background:transparent;color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#062018}.btn.danger{color:var(--red);border-color:rgba(255,133,133,.35)}
main{padding:40px 0 60px}.heading{margin-bottom:20px}.eyebrow{color:var(--accent);font-size:.7rem;font-weight:900;letter-spacing:.1em}.heading h1{font-size:clamp(1.7rem,4vw,2.25rem);margin:8px 0}.heading p{color:var(--muted);margin:0;line-height:1.7}
.panel{display:grid;grid-template-columns:260px 1fr;gap:24px;padding:25px;background:var(--panel);border:1px solid var(--line);border-radius:19px}
.profile{text-align:center;border-left:1px solid var(--line);padding-left:20px}.avatar{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;overflow:hidden;margin:4px auto 14px;background:rgba(84,224,176,.1);border:2px solid rgba(84,224,176,.45);color:var(--accent);font-size:38px}.avatar img{width:100%;height:100%;object-fit:cover}.profile h2{font-size:1.1rem;margin:0 0 5px}.handle{color:var(--muted);font-size:.8rem}.upload{margin-top:14px}.small{color:var(--muted);font-size:.72rem;line-height:1.6;margin:10px 0 0}
form{min-width:0}label{display:block;margin:13px 0 6px;font-size:.82rem;font-weight:800}.input{width:100%;height:45px;background:#0a1423;border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--text);outline:none}.input:focus{border-color:var(--accent)}textarea.input{height:105px;padding:11px;resize:vertical}.input[readonly]{opacity:.75}.form-actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}.status{min-height:24px;margin-top:12px;font-size:.83rem;color:var(--muted)}.status.ok{color:var(--accent)}.status.error{color:var(--red)}.hidden{display:none!important}
@media(max-width:680px){.panel{grid-template-columns:1fr}.profile{border-left:0;border-bottom:1px solid var(--line);padding:0 0 20px}.top{padding:14px 0;align-items:flex-start}.wrap{width:calc(100% - 24px)}}
</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="index.html"><i class="fa-solid fa-code"></i> CodeTHD</a><nav class="nav"><a class="btn" href="index.html"><i class="fa-solid fa-house"></i> الرئيسية</a><a class="btn" href="languages.html">ابدأ البرمجة</a></nav></div></header>
<main class="wrap">
  <div class="heading"><div class="eyebrow">YOUR ACCOUNT</div><h1>ملفك الشخصي</h1><p>حدّث اسمك وصورتك ومعلوماتك التي تظهر لأعضاء مجتمع CodeTHD.</p></div>
  <section class="panel">
    <aside class="profile">
      <div class="avatar" id="avatarBox"><i class="fa-solid fa-user"></i></div>
      <h2 id="cardName">حساب CodeTHD</h2><div class="handle" id="cardHandle">@username</div>
      <input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp" class="hidden">
      <button class="btn upload" id="chooseAvatar" type="button"><i class="fa-solid fa-camera"></i> تغيير الصورة</button>
      <p class="small">PNG أو JPG أو WebP، وبحجم لا يتجاوز 2 ميغابايت.</p>
    </aside>
    <form id="profileForm">
      <label for="email">البريد الإلكتروني</label><input class="input" id="email" type="email" readonly>
      <label for="username">اسم المستخدم</label><input class="input" id="username" readonly>
      <label for="displayName">الاسم الظاهر</label><input class="input" id="displayName" maxlength="80" required>
      <label for="bio">نبذة عنك</label><textarea class="input" id="bio" maxlength="240" placeholder="اكتب نبذة قصيرة عن اهتماماتك البرمجية..."></textarea>
      <div class="form-actions"><button class="btn primary" id="saveBtn" type="submit"><i class="fa-solid fa-floppy-disk"></i> حفظ التغييرات</button><button class="btn danger" id="logoutBtn" type="button"><i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج</button></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
  </section>
</main>
<script>
(async function(){
 const $=id=>document.getElementById(id),status=(t,c='')=>{$('status').textContent=t;$('status').className='status '+c};
 try{
  status('جارٍ تحميل حسابك...');
  const state=await CodeTHDCloud.ensureSession();
  if(!state){location.replace('auth.html');return}
  const p=state.profile||CodeTHDCloud.quickProfile(state.session.user),user=state.session.user;
  $('email').value=user.email||'';$('username').value=p.username||'';$('displayName').value=p.display_name||p.username||'';$('bio').value=p.bio||'';
  $('cardName').textContent=p.display_name||p.username||'حساب CodeTHD';$('cardHandle').textContent='@'+(p.username||'user');
  function showAvatar(url){if(!url)return;$('avatarBox').innerHTML='';const img=document.createElement('img');img.src=url;img.alt='الصورة الشخصية';$('avatarBox').appendChild(img)}
  showAvatar(p.avatar_url);
  $('chooseAvatar').onclick=()=>$('avatarFile').click();
  $('avatarFile').onchange=async()=>{
   const file=$('avatarFile').files[0];if(!file)return;
   $('chooseAvatar').disabled=true;status('جارٍ رفع الصورة...');
   try{const saved=await CodeTHDCloud.uploadAvatar(file);showAvatar(saved.avatar_url);status('تم تحديث الصورة الشخصية ✓','ok')}
   catch(e){status(CodeTHDCloud.errorText(e),'error')}finally{$('chooseAvatar').disabled=false;$('avatarFile').value=''}
  };
  $('profileForm').onsubmit=async e=>{
   e.preventDefault();$('saveBtn').disabled=true;status('جارٍ حفظ التعديلات...');
   try{const saved=await CodeTHDCloud.updateProfile({display_name:$('displayName').value.trim(),bio:$('bio').value.trim()});$('cardName').textContent=saved.display_name||p.username;status('تم حفظ ملفك الشخصي ✓','ok')}
   catch(err){status(CodeTHDCloud.errorText(err),'error')}finally{$('saveBtn').disabled=false}
  };
  $('logoutBtn').onclick=async()=>{$('logoutBtn').disabled=true;try{await CodeTHDCloud.signOut();location.replace('index.html')}catch(e){status(CodeTHDCloud.errorText(e),'error');$('logoutBtn').disabled=false}};
 }catch(e){status(CodeTHDCloud.errorText(e),'error')}
})();
</script>
</body>
</html>
